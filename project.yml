name: Layer
options:
  bundleIdPrefix: kahshin
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "3"
    TARGETED_DEVICE_FAMILY: "2"
    CODE_SIGN_STYLE: Automatic
    # Kah Shin Ang's team. iCloud and TestFlight both need one.
    DEVELOPMENT_TEAM: 2A24G6YRY3
packages:
  A2UI:
    url: https://github.com/a2ui-project/a2ui
    exact: "0.11.0"
targets:
  Layer:
    type: application
    platform: iOS
    sources:
      - Layer
    settings:
      base:
        # These identifiers are registered with Apple and can't be taken back: the
        # iCloud container iCloud.kahshin.Layer below in particular can never be deleted.
        PRODUCT_BUNDLE_IDENTIFIER: kahshin.Layer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Layer/Info.plist
      properties:
        CFBundleDisplayName: Layer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Layer uses no encryption of its own, which App Store Connect asks about for every build.
        ITSAppUsesNonExemptEncryption: false
        # Plain http only on the local network, for a model served by LM Studio.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Layer connects to LM Studio on your computer when you choose one of its models.
        NSMicrophoneUsageDescription: Layer listens while voice mode is on, so you can design by speaking.
        NSSpeechRecognitionUsageDescription: Layer turns what you say in voice mode into text on this iPad.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # Document-based: designs live in Files, are opened in place, and are owned by Layer.
        UISupportsDocumentBrowser: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Layer Design
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes:
              - kahshin.layer.design
        # A design is a package: a folder that Files and iCloud treat as one document.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: kahshin.layer.design
            UTTypeDescription: Layer Design
            UTTypeConformsTo:
              - com.apple.package
              - public.composite-content
            UTTypeTagSpecification:
              public.filename-extension:
                - layer
        # Gives Layer its own folder in iCloud Drive, visible in Files.
        NSUbiquitousContainers:
          iCloud.kahshin.Layer:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Layer
            NSUbiquitousContainerSupportedFolderLevels: Any
    entitlements:
      path: Layer/Layer.entitlements
      properties:
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.icloud-container-identifiers:
          - iCloud.kahshin.Layer
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.kahshin.Layer
    dependencies:
      - target: LayerThumbnails
      - package: A2UI
        product: A2UISwiftCore
      - package: A2UI
        product: BasicCatalog
  # Draws each design's picture in Files and in Layer's own document browser.
  LayerThumbnails:
    type: app-extension
    platform: iOS
    sources:
      - LayerThumbnails
      - path: Layer/Document/DesignPackage.swift
    settings:
      base:
        # An extension's identifier starts with its app's.
        PRODUCT_BUNDLE_IDENTIFIER: kahshin.Layer.Thumbnails
    info:
      path: LayerThumbnails/Info.plist
      properties:
        CFBundleDisplayName: Layer Thumbnails
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - kahshin.layer.design
            QLThumbnailMinimumDimension: 0
  LayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LayerTests
    dependencies:
      - target: Layer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: kahshin.LayerTests
  LayerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - LayerUITests
    dependencies:
      - target: Layer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: kahshin.LayerUITests
        TEST_TARGET_NAME: Layer
schemes:
  Layer:
    build:
      targets:
        Layer: all
        LayerTests: [test]
        LayerUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # Layer runs everything, as before. CI is for Xcode Cloud: unit tests only, with LAYER_CI set so
      # SiriIntentsLiveTests (flaky: it drives the document browser) is skipped.
      testPlans:
        - path: TestPlans/Layer.xctestplan
          defaultPlan: true
        - path: TestPlans/CI.xctestplan
    # Profiling and archiving measure and ship the optimised build.
    profile:
      config: Release
    archive:
      config: Release
